
services:
  # ─────────────────────────────────────────
  # PostgreSQL Database (Local)
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # pgAdmin 4 (PostgreSQL Web UI)
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-web
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 10
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Redis (BullMQ backend for scheduler)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # MongoDB (CQRS Read Model — Sync Service)
  # ─────────────────────────────────────────
  # Why a single-node REPLICA SET (not standalone)?
  # Prisma's MongoDB connector uses transactions internally for nested
  # writes (embedded types like UnifiedUser.identities). Transactions
  # require a replica set — standalone mongo fails with:
  #   "Prisma needs to perform transactions, which requires your
  #    MongoDB server to be run as a replica set."
  # One-time bootstrap after first start: see docs/cqrs-mongo-setup.md
  # (or just run `rs.initiate()` against `mongo:27017`).
  #
  # Why NO auth? Mongo+replSet+auth needs a keyfile that's a pain to
  # manage cross-platform via bind mounts. This mongo is only reachable
  # from the internal `microservices-network`; we don't expose it
  # outside docker. If you ever need auth, add `--keyFile` and revert
  # MONGO_USER/PASS into the env block.
  #
  # Why mongo:4.4 (not 5+)? MongoDB 5+ needs CPU AVX instructions,
  # which some VPS hosts don't expose. 4.4 is the last version that
  # works on older hardware. Prisma 5 supports 4.4 fully.
  mongo:
    image: mongo:4.4
    container_name: mongo
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Stays unhealthy until rs.initiate() has been run (by mongo-init).
      # Once initialized, `rs.status().ok` returns 1 and this passes,
      # which gates `sync`'s startup.
      test:
        - CMD-SHELL
        - 'mongo --quiet --eval "try { rs.status().ok } catch (e) { quit(1) }" | grep -q 1'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - microservices-network

  # One-shot bootstrap: waits for `mongo` to accept pings, then calls
  # rs.initiate() if the replica set hasn't been initialized yet. Exits
  # immediately after. Safe to re-run (idempotent — second invocation
  # sees the existing rs config and no-ops).
  mongo-init:
    image: mongo:4.4
    container_name: mongo-init
    restart: 'no'
    depends_on:
      - mongo
    entrypoint:
      - bash
      - -c
      - |
        echo "[mongo-init] waiting for mongo:27017..."
        until mongo --host mongo:27017 --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; do
          sleep 1
        done
        echo "[mongo-init] mongo is up; checking replica set state"
        STATUS=$$(mongo --host mongo:27017 --quiet --eval 'try { rs.status().ok } catch (e) { print(0) }')
        if [ "$$STATUS" = "1" ]; then
          echo "[mongo-init] replica set already initialized — nothing to do"
        else
          echo "[mongo-init] initializing rs0..."
          mongo --host mongo:27017 --quiet --eval '
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]})
          '
          # Poll until rs.status().ok == 1 so dependent services don't
          # start before the cluster is actually ready.
          for i in $$(seq 1 30); do
            ok=$$(mongo --host mongo:27017 --quiet --eval 'try { rs.status().ok } catch (e) { print(0) }')
            if [ "$$ok" = "1" ]; then
              echo "[mongo-init] replica set is up after $${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "[mongo-init] ERROR: replica set never reached ok=1" >&2
          exit 1
        fi
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Message Broker
  # ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - '5672:5672'    # AMQP protocol
      - '15672:15672'  # Management UI → http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - '${GATEWAY_PORT}:${GATEWAY_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: ${GATEWAY_DATABASE_URL}
      PORT: ${GATEWAY_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SYNC_SERVICE_URL: ${SYNC_SERVICE_URL:-http://sync:3012}
      SYNC_INTERNAL_AUTH_TOKEN: ${SYNC_INTERNAL_AUTH_TOKEN}
      SERVICE_NAME: gateway
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Identity Service
  # ─────────────────────────────────────────
  identity:
    build:
      context: ./identity
      dockerfile: Dockerfile
    container_name: identity-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${IDENTITY_PORT}:${IDENTITY_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: ${IDENTITY_DATABASE_URL}
      PORT: ${IDENTITY_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_BACKFILL_TOKEN: ${ADMIN_BACKFILL_TOKEN}
      SERVICE_NAME: identity
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # WhatsApp Microservice
  # ─────────────────────────────────────────
  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    container_name: whatsapp-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${WHATSAPP_PORT}:${WHATSAPP_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: ${WHATSAPP_DATABASE_URL}
      PORT: ${WHATSAPP_PORT}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_BACKFILL_TOKEN: ${ADMIN_BACKFILL_TOKEN}
      SERVICE_NAME: whatsapp
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Slack Microservice
  # ─────────────────────────────────────────
  slack:
    build:
      context: ./slack
      dockerfile: Dockerfile
    container_name: slack-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${SLACK_PORT}:${SLACK_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: ${SLACK_DATABASE_URL}
      PORT: ${SLACK_PORT}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_BACKFILL_TOKEN: ${ADMIN_BACKFILL_TOKEN}
      SERVICE_NAME: slack
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Notion Microservice
  # ─────────────────────────────────────────
  notion:
    build:
      context: ./notion
      dockerfile: Dockerfile
    container_name: notion-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${NOTION_PORT}:${NOTION_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: ${NOTION_DATABASE_URL}
      PORT: ${NOTION_PORT}
      NOTION_INTEGRATION_TOKEN: ${NOTION_INTEGRATION_TOKEN}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_NAME: notion
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Instagram Microservice
  # ─────────────────────────────────────────
  instagram:
    build:
      context: ./instagram
      dockerfile: Dockerfile
    container_name: instagram-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${INSTAGRAM_PORT}:${INSTAGRAM_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: ${INSTAGRAM_DATABASE_URL}
      PORT: ${INSTAGRAM_PORT}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN}
      INSTAGRAM_PAGE_ID: ${INSTAGRAM_PAGE_ID}
      INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN}
      INSTAGRAM_API_VERSION: ${INSTAGRAM_API_VERSION}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_BACKFILL_TOKEN: ${ADMIN_BACKFILL_TOKEN}
      SERVICE_NAME: instagram
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # TikTok Microservice
  # ─────────────────────────────────────────
  tiktok:
    build:
      context: ./tiktok
      dockerfile: Dockerfile
    container_name: tiktok-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${TIKTOK_PORT}:${TIKTOK_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: ${TIKTOK_DATABASE_URL}
      PORT: ${TIKTOK_PORT}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_NAME: tiktok
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Facebook Microservice
  # ─────────────────────────────────────────
  facebook:
    build:
      context: ./facebook
      dockerfile: Dockerfile
    container_name: facebook-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${FACEBOOK_PORT}:${FACEBOOK_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: ${FACEBOOK_DATABASE_URL}
      PORT: ${FACEBOOK_PORT}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID}
      FACEBOOK_WEBHOOK_VERIFY_TOKEN: ${FACEBOOK_WEBHOOK_VERIFY_TOKEN}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_NAME: facebook
      FACEBOOK_API_VERSION: ${FACEBOOK_API_VERSION}
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Scraping Microservice
  # ─────────────────────────────────────────
  # ─────────────────────────────────────────
  # Browserless Chrome (for Puppeteer)
  # ─────────────────────────────────────────
  browserless:
    image: browserless/chrome:latest
    container_name: browserless-chrome
    restart: unless-stopped
    ports:
      - '3222:3222'
    environment:
      PORT: 3222
      TIMEOUT: 300000
      CONNECTION_TIMEOUT: 60000
      MAX_CONCURRENCY: 10
    networks:
      - microservices-network

  scraping:
     build:
       context: ./scrapping
       dockerfile: Dockerfile
     container_name: scraping-service
     restart: unless-stopped
     env_file: .env
     ports:
       - '${SCRAPING_PORT:-3008}:3008'
     depends_on:
       postgres:
         condition: service_healthy
       rabbitmq:
         condition: service_healthy
       redis:
         condition: service_healthy
       browserless:
         condition: service_started
     environment:
       RABBITMQ_URL: ${RABBITMQ_URL}
       RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-channels}
       # New v2: Prisma DB + Redis for session persistence
       DATABASE_URL: ${SCRAPING_DATABASE_URL}
       SCRAPING_DATABASE_URL: ${SCRAPING_DATABASE_URL}
       REDIS_HOST: ${REDIS_HOST:-redis}
       REDIS_PORT: ${REDIS_PORT:-6379}
       # Browserless Chrome connection
       BROWSERLESS_WS_ENDPOINT: ws://browserless:3222
       PUPPETEER_TIMEOUT: ${PUPPETEER_TIMEOUT:-60000}
       PUPPETEER_MAX_POOL_SIZE: ${PUPPETEER_MAX_POOL_SIZE:-20}
       PUPPETEER_PAGES_PER_BROWSER: ${PUPPETEER_PAGES_PER_BROWSER:-5}
       PUPPETEER_HEADLESS: 'true'
       RATE_LIMIT_DAILY: ${RATE_LIMIT_DAILY:-10}
       RATE_LIMIT_WINDOW_HOURS: ${RATE_LIMIT_WINDOW_HOURS:-24}
       LOG_LEVEL: info
       NODE_ENV: production
       POSTGRES_HOST: ${POSTGRES_HOST}
       POSTGRES_PORT: ${POSTGRES_PORT}
       POSTGRES_USER: ${POSTGRES_USER}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
       ADMIN_BACKFILL_TOKEN: ${ADMIN_BACKFILL_TOKEN}
       SERVICE_NAME: scraping
     networks:
       - microservices-network

  # ─────────────────────────────────────────
  # Mailpit — local SMTP capture for dev (web UI :8025, SMTP :1025)
  # Activate with `docker-compose --profile dev up`
  # ─────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    profiles: [dev]
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Email Microservice (Resend / SMTP via adapter)
  # ─────────────────────────────────────────
  email:
    build:
      context: ./email
      dockerfile: Dockerfile
    container_name: email-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${EMAIL_PORT:-3007}:3007'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-channels}
      DATABASE_URL: ${EMAIL_DATABASE_URL}
      EMAIL_DATABASE_URL: ${EMAIL_DATABASE_URL}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_DOMAINS_CONFIG: ${EMAIL_DOMAINS_CONFIG}
      INBOUND_EMAIL_WEBHOOK_SECRET: ${INBOUND_EMAIL_WEBHOOK_SECRET}
      INBOUND_EMAIL_TTL_MS: ${INBOUND_EMAIL_TTL_MS:-2592000000}
      # Legacy single-domain fallback (used only when EMAIL_DOMAINS_CONFIG is empty)
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}
      PORT: ${EMAIL_PORT:-3007}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_BACKFILL_TOKEN: ${ADMIN_BACKFILL_TOKEN}
      SERVICE_NAME: email
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Agent Microservice (AI orchestrator — vendor-neutral)
  # ─────────────────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: agent-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${AGENT_PORT:-3011}:3011'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-channels}
      DATABASE_URL: ${AGENT_DATABASE_URL}
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      AGENT_CONVERSATION_TTL_MS: ${AGENT_CONVERSATION_TTL_MS:-2592000000}
      PORT: ${AGENT_PORT:-3011}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_BACKFILL_TOKEN: ${ADMIN_BACKFILL_TOKEN}
      SERVICE_NAME: agent
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Sync Service (CQRS read model on MongoDB)
  # Consumes data.* events; queried by Gateway via internal HTTPS only.
  # ─────────────────────────────────────────
  sync:
    build:
      context: ./sync
      dockerfile: Dockerfile
    container_name: sync-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${SYNC_PORT:-3012}:3012'
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-channels}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      SYNC_INTERNAL_AUTH_TOKEN: ${SYNC_INTERNAL_AUTH_TOKEN}
      PORT: ${SYNC_PORT:-3012}
      SYNC_PORT: ${SYNC_PORT:-3012}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      SERVICE_NAME: sync
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Scheduler Microservice (BullMQ + Redis)
  # ─────────────────────────────────────────
  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: scheduler-service
    restart: unless-stopped
    env_file: .env
    ports:
      - '${SCHEDULER_PORT:-3009}:3009'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-channels}
      DATABASE_URL: ${SCHEDULER_DATABASE_URL}
      SCHEDULER_DATABASE_URL: ${SCHEDULER_DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      PORT: ${SCHEDULER_PORT:-3009}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_NAME: scheduler
    networks:
      - microservices-network

volumes:
  postgres_data:
  pgadmin_data:
  rabbitmq_data:
  redis_data:
  mongo_data:

networks:
  microservices-network:
    name: microservices-network
